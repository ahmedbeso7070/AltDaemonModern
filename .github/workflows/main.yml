From: Claude <noreply@anthropic.com>
Date: Fri, 9 Oct 2026 07:03:30 +0000
Subject: [PATCH] ci: build arm64 rootless and arm64e RootHide .deb packages

- Add ALTDAEMON_ARCHS to build-altdaemon.sh and build-altstore-auth-compat.sh
- Add RootHide package layout (iphoneos-arm64e, jbroot-aware scripts, no /var/jb)
- Add scripts/build-roothide-deb.sh (requires an arm64e slice)
- Workflow builds both packages via a matrix and uploads the .deb files

Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
Claude-Session: https://claude.ai/code/session_01Co12F2cjYeQVALQeB193cJ
