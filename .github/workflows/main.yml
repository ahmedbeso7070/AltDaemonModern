new file mode 100644
index 0000000..bb24af0
--- /dev/null
+++ b/AltDaemon/package-roothide/DEBIAN/control
@@ -0,0 +1,13 @@
+Package: com.rileytestut.altdaemon
+Name: AltDaemon Modern (RootHide)
+Version: 1.2.0
+Architecture: iphoneos-arm64e
+Depends: ellekit (>= 1.2)
+Description: AltDaemon for RootHide jailbreaks with current Apple login compatibility.
+ AltDaemon allows compatible AltStore builds to install and refresh apps
+ without a computer. This build targets RootHide jailbreaks and contains
+ arm64 and arm64e slices.
+Maintainer: AltDaemonModern contributors
+Author: Riley Testut and AltDaemonModern contributors
+Homepage: https://github.com/altstoreio/AltStore
+Section: Tweaks
diff --git a/AltDaemon/package-roothide/DEBIAN/postinst b/AltDaemon/package-roothide/DEBIAN/postinst
new file mode 100755
index 0000000..0f74030
--- /dev/null
+++ b/AltDaemon/package-roothide/DEBIAN/postinst
@@ -0,0 +1,22 @@
+#!/bin/sh
+set -e
+
+# RootHide randomizes the jailbreak root, so launchd needs real (jbroot-resolved)
+# paths. The packaged plist carries a placeholder that is replaced here.
+if command -v jbroot >/dev/null 2>&1; then
+    ALTDAEMON_LAUNCHCTL=$(jbroot /usr/bin/launchctl)
+    ALTDAEMON_PROGRAM=$(jbroot /usr/bin/AltDaemon)
+    ALTDAEMON_PLIST=$(jbroot /Library/LaunchDaemons/com.rileytestut.altdaemon.plist)
+else
+    ALTDAEMON_LAUNCHCTL=/usr/bin/launchctl
+    ALTDAEMON_PROGRAM=/usr/bin/AltDaemon
+    ALTDAEMON_PLIST=/Library/LaunchDaemons/com.rileytestut.altdaemon.plist
+fi
+[ -x "$ALTDAEMON_LAUNCHCTL" ] || ALTDAEMON_LAUNCHCTL=launchctl
+
+sed "s|__ALTDAEMON_PROGRAM__|$ALTDAEMON_PROGRAM|g" "$ALTDAEMON_PLIST" > "$ALTDAEMON_PLIST.new"
+mv "$ALTDAEMON_PLIST.new" "$ALTDAEMON_PLIST"
+chmod 0644 "$ALTDAEMON_PLIST"
+
+"$ALTDAEMON_LAUNCHCTL" bootstrap system "$ALTDAEMON_PLIST"
+"$ALTDAEMON_LAUNCHCTL" kickstart -k user/foreground/com.rileytestut.altdaemon
