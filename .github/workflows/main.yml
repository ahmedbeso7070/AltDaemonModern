diff --git a/.github/workflows/altdaemon.yml b/.github/workflows/altdaemon.yml
index 7e9a2af..3d2b491 100644
--- a/.github/workflows/altdaemon.yml
+++ b/.github/workflows/altdaemon.yml
@@ -12,6 +12,7 @@ on:
       - "scripts/build-altdaemon.sh"
       - "scripts/build-altstore-auth-compat.sh"
       - "scripts/build-rootless-deb.sh"
+      - "scripts/build-roothide-deb.sh"
       - ".github/workflows/altdaemon.yml"
   pull_request:
     paths:
@@ -24,28 +25,69 @@ on:
       - "scripts/build-altdaemon.sh"
       - "scripts/build-altstore-auth-compat.sh"
       - "scripts/build-rootless-deb.sh"
+      - "scripts/build-roothide-deb.sh"
       - ".github/workflows/altdaemon.yml"
   workflow_dispatch:
 
 jobs:
   build:
+    name: ${{ matrix.name }}
     runs-on: macos-15
     timeout-minutes: 30
+    strategy:
+      # Keep the rootless package even if the arm64e RootHide build fails.
+      fail-fast: false
+      matrix:
+        include:
+          - name: rootless-arm64
+            archs: "arm64"
+            deb_script: scripts/build-rootless-deb.sh
+            deb_name: AltDaemonModern_1.2.0_iphoneos-arm64.deb
+          - name: roothide-arm64e
+            archs: "arm64 arm64e"
+            deb_script: scripts/build-roothide-deb.sh
+            deb_name: AltDaemonModern_1.2.0_iphoneos-arm64e.deb
 
     steps:
       - uses: actions/checkout@v4
         with:
           submodules: recursive
 
+      - name: Show OpenSSL slices
+        run: |
+          for lib in Dependencies/AltSign/Dependencies/OpenSSL/iphoneos/lib/*.a; do
+            lipo -info "$lib" || true
+          done
+
       - name: Build AltDaemon
         env:
+          ALTDAEMON_ARCHS: ${{ matrix.archs }}
           ALTDAEMON_DERIVED_DATA_DIR: ${{ runner.temp }}/AltDaemonDerivedData
           ALTDAEMON_PACKAGE_CACHE_DIR: ${{ runner.temp }}/AltDaemonPackages
         run: scripts/build-altdaemon.sh
 
       - name: Build AltStore authentication compatibility module
+        env:
+          ALTDAEMON_ARCHS: ${{ matrix.archs }}
         run: scripts/build-altstore-auth-compat.sh "${{ runner.temp }}/AltStoreAuthCompat.dylib"
 
+      - name: Check built architectures
+        run: |
+          lipo -archs "${{ runner.temp }}/AltDaemonDerivedData/Build/Products/Release-iphoneos/AltDaemon"
+          lipo -archs "${{ runner.temp }}/AltStoreAuthCompat.dylib"
+
+      - name: Install packaging tools
+        run: brew install ldid dpkg
+
+      - name: Build .deb package
+        env:
+          ALTDAEMON_AUTH_COMPAT_BINARY: ${{ runner.temp }}/AltStoreAuthCompat.dylib
+        run: |
+          mkdir -p "${{ runner.temp }}/AltDaemonDeb"
+          ${{ matrix.deb_script }} \
+            "${{ runner.temp }}/AltDaemonDerivedData/Build/Products/Release-iphoneos/AltDaemon" \
+            "${{ runner.temp }}/AltDaemonDeb/${{ matrix.deb_name }}"
+
       - name: Stage unsigned artifact
         env:
           ALTDAEMON_ARTIFACT_DIR: ${{ runner.temp }}/AltDaemonArtifact
@@ -61,9 +103,16 @@ jobs:
           shasum -a 256 "$ALTDAEMON_ARTIFACT_DIR/AltDaemon" > "$ALTDAEMON_ARTIFACT_DIR/AltDaemon.sha256"
           shasum -a 256 "$ALTDAEMON_ARTIFACT_DIR/AltStoreAuthCompat.dylib" > "$ALTDAEMON_ARTIFACT_DIR/AltStoreAuthCompat.dylib.sha256"
 
-      - name: Publish workflow artifact
+      - name: Publish .deb package
+        uses: actions/upload-artifact@v4
+        with:
+          name: AltDaemonModern-${{ matrix.name }}-deb
+          path: ${{ runner.temp }}/AltDaemonDeb/${{ matrix.deb_name }}
+          if-no-files-found: error
+
+      - name: Publish unsigned workflow artifact
         uses: actions/upload-artifact@v4
         with:
-          name: AltDaemon-unsigned-arm64
+          name: AltDaemon-unsigned-${{ matrix.name }}
           path: ${{ runner.temp }}/AltDaemonArtifact
           if-no-files-found: error
diff --git a/AltDaemon/README.md b/AltDaemon/README.md
index 37e17af..a10efcf 100644
--- a/AltDaemon/README.md
+++ b/AltDaemon/README.md
@@ -31,7 +31,7 @@ This fork repairs AltDaemon for rootless jailbreaks and replaces its obsolete 20
   communication failures.
 - Includes daemon-specific target fixes needed to build current upstream source.
 
-The minimum deployment target is iOS 15.0. The primary target is Dopamine's standard rootless environment; RootHide is not currently supported.
+The minimum deployment target is iOS 15.0. The primary target is Dopamine's standard rootless environment (`iphoneos-arm64`). A RootHide package (`iphoneos-arm64e`, with arm64 and arm64e slices) is also built by CI; it has not been validated on a device yet.
 
 ## Build
 
@@ -59,6 +59,17 @@ scripts/build-rootless-deb.sh /path/to/AltDaemon /path/to/AltDaemonModern.deb
 
 The package builder stages files under `/var/jb`, signs a private copy of the input binary, and includes the AGPL and third-party notices. It never changes the input binary.
 
+To build a RootHide package, build the daemon with both slices and use the RootHide packager:
+
+```sh
+ALTDAEMON_ARCHS="arm64 arm64e" scripts/build-altdaemon.sh
+scripts/build-roothide-deb.sh /path/to/AltDaemon /path/to/AltDaemonModern-roothide.deb
+```
+
+The RootHide package is `iphoneos-arm64e` and stages files at ordinary paths (`/usr/bin`, `/Library/LaunchDaemons`, `/Library/MobileSubstrate/DynamicLibraries`) instead of `/var/jb`. Its package scripts resolve the randomized jailbreak root with `jbroot` and write the real daemon path into the launchd plist at install time. The packager refuses a binary without an arm64e slice.
+
+The GitHub Actions workflow `AltDaemon` builds both packages (`AltDaemonModern_1.2.0_iphoneos-arm64.deb` and `AltDaemonModern_1.2.0_iphoneos-arm64e.deb`) and uploads them as workflow artifacts.
+
 ## Configuration
 
 The default provider order is `https://ani.sidestore.io`,
